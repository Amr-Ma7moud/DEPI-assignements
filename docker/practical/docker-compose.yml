#  no network is created as the requirements didn't specift that the database should not be accessible from outside the network

services:
  nginx:
    image: docker-task
    ports:
      - "8080:8080"

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: